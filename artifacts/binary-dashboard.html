<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BINARY/TEXT</title>
<style>
  :root{
    --iron-1:#0d0c0a;
    --iron-2:#1c1a16;
    --plate-1:#3a3d3f;
    --plate-2:#232527;
    --plate-edge:#57595b;
    --rivet:#111213;
    --ivory:#ddd6c4;
    --ivory-shadow:#a89d80;
    --brass:#8a7a54;
    --brass-light:#c9b686;
    --off:#6c675a;
    --on:#8f2c22;
    --on-light:#b6483a;
    --engrave:#25231d;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    height:100%;
    margin:0;
    background:
      radial-gradient(ellipse at 50% 35%, var(--iron-2) 0%, var(--iron-1) 72%);
    overflow-y:auto;
    overflow-x:hidden;
    touch-action:manipulation;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:16px;
  }

  .rig{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(14px, 4vh, 28px);
    width:100%;
    max-width:640px;
  }

  /* ---- plate housing the sliders ---- */
  .panel{
    position:relative;
    width:100%;
    padding:clamp(12px, 3vh, 22px) clamp(10px, 3vw, 20px);
    border-radius:6px;
    background:
      linear-gradient(155deg, var(--plate-1) 0%, var(--plate-2) 60%, #1a1c1d 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 -1px 0 rgba(0,0,0,0.5) inset,
      0 18px 40px rgba(0,0,0,0.55),
      0 2px 0 rgba(0,0,0,0.4);
    border:1px solid #131414;
  }

  .rivet{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #7a7c7e, var(--rivet) 70%);
    box-shadow: 0 1px 1px rgba(0,0,0,0.8);
  }
  .rivet.tl{ top:9px; left:9px; }
  .rivet.tr{ top:9px; right:9px; }
  .rivet.bl{ bottom:9px; left:9px; }
  .rivet.br{ bottom:9px; right:9px; }

  .rack{
    display:flex;
    align-items:stretch;
    gap: clamp(6px, 1.6vw, 14px);
    width:100%;
  }

  .slots{
    display:grid;
    grid-template-columns: repeat(11, 1fr);
    gap: clamp(3px, 1vw, 8px);
    flex:1 1 auto;
    min-width:0;
  }

  /* ---- push button, end of row ---- */
  .press{
    position:relative;
    flex:0 0 auto;
    width:clamp(30px, 7vw, 46px);
    aspect-ratio: 1 / 1;
    align-self:center;
    border-radius:50%;
    border:none;
    padding:0;
    cursor:pointer;
    background: radial-gradient(circle at 32% 28%, #cbb789, var(--brass) 55%, #6e5e3c 100%);
    box-shadow:
      0 0 0 1px #4a3f28,
      0 0 0 3px rgba(0,0,0,0.35),
      inset 0 1px 1px rgba(255,255,255,0.5),
      inset 0 -3px 4px rgba(0,0,0,0.35),
      0 3px 4px rgba(0,0,0,0.55);
    -webkit-tap-highlight-color:transparent;
  }
  .press:active{
    box-shadow:
      0 0 0 1px #4a3f28,
      0 0 0 3px rgba(0,0,0,0.35),
      inset 0 2px 4px rgba(0,0,0,0.5);
    transform: translateY(1px);
  }
  .press.clear{
    background: radial-gradient(circle at 32% 28%, var(--on-light), var(--on) 55%, #4d140f 100%);
    box-shadow:
      0 0 0 1px #3a0f0b,
      0 0 0 3px rgba(0,0,0,0.35),
      inset 0 1px 1px rgba(255,255,255,0.35),
      inset 0 -3px 4px rgba(0,0,0,0.4),
      0 3px 4px rgba(0,0,0,0.55);
  }
  .press.clear:active{
    box-shadow:
      0 0 0 1px #3a0f0b,
      0 0 0 3px rgba(0,0,0,0.35),
      inset 0 2px 4px rgba(0,0,0,0.55);
    transform: translateY(1px);
  }

  /* ---- typed-letter echo ---- */
  .buffer-rack{
    display:flex;
    align-items:stretch;
    gap: clamp(6px, 1.6vw, 14px);
    width:100%;
    margin-bottom: clamp(10px, 2.4vh, 18px);
  }
  .buffer{
    position:relative;
    width:100%;
    min-height:clamp(40px, 9vw, 58px);
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:3px;
    background: linear-gradient(180deg, #cfc7ac, var(--ivory) 12%, var(--ivory) 88%, #c7bfa4);
    box-shadow:
      0 0 0 1px var(--brass),
      0 0 0 2px rgba(0,0,0,0.35),
      inset 0 1px 2px rgba(255,255,255,0.5),
      inset 0 -3px 5px rgba(0,0,0,0.18),
      0 2px 3px rgba(0,0,0,0.5);
    overflow:hidden;
    padding:0 10px;
    flex:1 1 auto;
    min-width:0;
  }
  .buffer-index{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    font-family: 'Courier New', monospace;
    font-size: clamp(12px, 3.4vw, 17px);
    font-weight:700;
    letter-spacing:0.5px;
    color: var(--ivory-shadow);
    opacity:0.75;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
    pointer-events:none;
  }
  .buffer-text{
    font-family: 'Courier New', monospace;
    font-size: clamp(16px, 6vw, 26px);
    font-weight:700;
    letter-spacing:4px;
    text-transform:uppercase;
    color: var(--engrave);
    opacity:0.85;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    white-space:nowrap;
  }

  /* ---- keyboard ---- */
  .keys{
    display:flex;
    flex-direction:column;
    gap: clamp(4px, 1.2vw, 8px);
    flex:1 1 auto;
    min-width:0;
  }
  .krow{
    display:grid;
    gap: clamp(3px, 1vw, 8px);
    width:100%;
  }
  .krow[data-row="1"]{ grid-template-columns: repeat(10, 1fr); }
  .krow[data-row="2"]{ grid-template-columns: repeat(9, 1fr); padding:0 3.5%; }
  .krow[data-row="3"]{ grid-template-columns: repeat(7, 1fr); padding:0 7%; }

  .key{
    position:relative;
    width:100%;
    aspect-ratio: 1 / 1;
    border-radius:3px;
    background: linear-gradient(180deg, #cfc7ac, var(--ivory) 12%, var(--ivory) 88%, #c7bfa4);
    box-shadow:
      0 0 0 1px var(--brass),
      0 0 0 2px rgba(0,0,0,0.35),
      inset 0 1px 2px rgba(255,255,255,0.5),
      inset 0 -3px 5px rgba(0,0,0,0.18),
      0 2px 3px rgba(0,0,0,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    border:none;
    padding:0;
    font-family: 'Courier New', monospace;
    font-size: clamp(13px, 4.6vw, 21px);
    font-weight:700;
    text-transform:uppercase;
    color: var(--engrave);
    opacity:0.85;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    transition: opacity 0.15s ease, filter 0.15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .key:active{ filter:brightness(0.94); }
  .key.disabled{
    opacity:0.16;
    filter:grayscale(70%);
    cursor:default;
    pointer-events:none;
  }

  /* ---- individual in/out slider ---- */
  .slot{
    position:relative;
    width:100%;
    aspect-ratio: 44 / 64;
    border-radius:3px;
    background: linear-gradient(180deg, #cfc7ac, var(--ivory) 12%, var(--ivory) 88%, #c7bfa4);
    box-shadow:
      0 0 0 1px var(--brass),
      0 0 0 2px rgba(0,0,0,0.35),
      inset 0 1px 2px rgba(255,255,255,0.5),
      inset 0 -3px 5px rgba(0,0,0,0.18),
      0 2px 3px rgba(0,0,0,0.5);
    cursor:pointer;
    user-select:none;
    overflow:hidden;
  }
  .slot.static{ cursor:default; }

  .digit{
    position:absolute;
    left:0; right:0;
    text-align:center;
    font-family: 'Courier New', monospace;
    font-size:clamp(16px, 8vw, 30px);
    font-weight:700;
    line-height:1;
    color: var(--engrave);
    opacity:0.8;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .digit.d1{ top:6%; }
  .digit.d0{ bottom:6%; }

  .knob{
    position:absolute;
    left:8%;
    width:84%;
    height:36%;
    border-radius:2px;
    background: linear-gradient(180deg, var(--off) 0%, #4c4a41 55%, #3a3830 100%);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.55),
      inset 0 1px 1px rgba(255,255,255,0.25),
      inset 0 -2px 3px rgba(0,0,0,0.35),
      0 2px 3px rgba(0,0,0,0.45);
    top:8%;
    transition: top 0.16s cubic-bezier(.4,0,.2,1), background 0.2s ease;
  }
  .knob::after{
    content:"";
    position:absolute;
    left:50%; top:50%;
    width:34%; height:2px;
    background:rgba(255,255,255,0.18);
    transform:translate(-50%,-50%);
  }

  .slot[data-state="1"] .knob{
    top:56%;
    background: linear-gradient(180deg, var(--on-light) 0%, var(--on) 55%, #6e1f18 100%);
  }
  .slot[data-state="0"] .knob{
    top:8%;
    background: linear-gradient(180deg, #82817a 0%, #58564d 55%, #403e37 100%);
  }

  .slot:active .knob{
    filter: brightness(1.08);
  }

  .bits-rack{
    margin-bottom: clamp(12px, 2.8vh, 20px);
  }

</style>
</head>
<body>

  <div class="rig">
    <div class="panel" id="panel">
      <div class="rivet tl"></div>
      <div class="rivet tr"></div>
      <div class="rivet bl"></div>
      <div class="rivet br"></div>

      <div class="rack buffer-rack">
        <div class="buffer" id="buffer">
          <div class="buffer-index" id="bufferIndex"></div>
          <div class="buffer-text" id="bufferText"></div>
        </div>
        <button class="press clear" id="clear" aria-label="Clear"></button>
      </div>

      <div class="rack bits-rack">
        <div class="slots bits-row" id="bits"></div>
        <button class="press" id="reveal" aria-label="Reveal word from sliders"></button>
      </div>

      <div class="keys" id="keys">
        <div class="krow" data-row="1" id="row1"></div>
        <div class="krow" data-row="2" id="row2"></div>
        <div class="rack">
          <div class="krow" data-row="3" id="row3"></div>
          <button class="press" id="backspace" aria-label="Delete last letter"></button>
        </div>
      </div>
    </div>
  </div>

  var N = 11;

  var slotsEl = document.getElementById('bits');
  var bufferEl = document.getElementById('bufferText');
  var bufferIndexEl = document.getElementById('bufferIndex');
  var clearEl = document.getElementById('clear');
  var row1 = document.getElementById('row1');
  var row2 = document.getElementById('row2');
  var row3 = document.getElementById('row3');
  var backspaceEl = document.getElementById('backspace');
  var revealEl = document.getElementById('reveal');

  var LAYOUT = [
    'qwertyuiop'.split(''),
    'asdfghjkl'.split(''),
    'zxcvbnm'.split('')
  ];
  var ROW_EL = [row1, row2, row3];

  var mode = null;           // null | 'keys' | 'slider'
  var buffer = '';           // built by typing
  var sliderBits = new Array(N).fill(null); // built by sliding
  var keyEls = {};
  var bitEls = [];

  LAYOUT.forEach(function(rowLetters, r){
    rowLetters.forEach(function(letter){
      var key = document.createElement('button');
      key.className = 'key';
      key.type = 'button';
      key.textContent = letter;
      key.setAttribute('aria-label', letter);
      key.addEventListener('click', function(){
        if (mode !== 'keys'){
          mode = 'keys';
          sliderBits = new Array(N).fill(null);
          buffer = '';
        }
        buffer += letter;
        renderBitsFromBuffer();
        renderKeys();
      });
      keyEls[letter] = key;
      ROW_EL[r].appendChild(key);
    });
  });

  // ---- bit sliders (interactive: click upper/lower half to set 1/0) ----
  for (var i = 0; i < N; i++){
    (function(i){
      var slot = document.createElement('div');
      slot.className = 'slot';
      slot.setAttribute('role', 'button');
      slot.setAttribute('aria-label', 'Bit ' + (i + 1) + ' of ' + N);
      slot.dataset.state = '0';

      var d1 = document.createElement('div');
      d1.className = 'digit d1';
      d1.textContent = '1';
      var d0 = document.createElement('div');
      d0.className = 'digit d0';
      d0.textContent = '0';
      var knob = document.createElement('div');
      knob.className = 'knob';

      slot.appendChild(d1);
      slot.appendChild(d0);
      slot.appendChild(knob);

      slot.addEventListener('click', function(e){
        if (mode !== 'slider'){
          mode = 'slider';
          buffer = '';
          renderKeys();
        }
        var rect = slot.getBoundingClientRect();
        var y = e.clientY - rect.top;
        var v = (y < rect.height / 2) ? 1 : 0;
        sliderBits[i] = v;
        renderBitsFromSlider();
      });

      slotsEl.appendChild(slot);
      bitEls.push(slot);
    })(i);
  }

  function isPrefix(s){
    if (s === '') return true;
    for (var i = 0; i < WORDS.length; i++){
      if (WORDS[i].indexOf(s) === 0) return true;
    }
    return false;
  }

  function exactWord(s){
    for (var i = 0; i < WORDS.length; i++){
      if (WORDS[i] === s) return i;
    }
    return -1;
  }

  function renderKeys(){
    for (var letter in keyEls){
      var allowed = isPrefix(buffer + letter);
      keyEls[letter].classList.toggle('disabled', !allowed);
    }
  }

  function updateIndexDisplay(idx){
    if (idx === -1){
      bufferIndexEl.textContent = '';
      return;
    }
    var n = String(idx + 1);
    while (n.length < 4) n = '0' + n;
    bufferIndexEl.textContent = n;
  }

  function renderBitsFromBuffer(){
    bufferEl.textContent = buffer;
    var idx = exactWord(buffer);
    updateIndexDisplay(idx);
    var bin = (idx !== -1) ? idx.toString(2) : '0';
    while (bin.length < N) bin = '0' + bin;
    for (var i = 0; i < N; i++){
      bitEls[i].dataset.state = bin.charAt(i);
    }
  }

  function renderBitsFromSlider(){
    for (var i = 0; i < N; i++){
      bitEls[i].dataset.state = (sliderBits[i] === null) ? '0' : String(sliderBits[i]);
    }
    var complete = sliderBits.every(function(v){ return v !== null; });
    if (complete){
      var idx = 0;
      for (var i = 0; i < N; i++){ idx = (idx << 1) | sliderBits[i]; }
      buffer = WORDS[idx];
      updateIndexDisplay(idx);
    } else {
      buffer = '';
      updateIndexDisplay(-1);
    }
    bufferEl.textContent = buffer;
  }

  function resetAll(){
    mode = null;
    buffer = '';
    sliderBits = new Array(N).fill(null);
    renderBitsFromBuffer();
    renderKeys();
  }

  revealEl.addEventListener('click', function(){
    if (mode !== 'slider'){
      mode = 'slider';
      buffer = '';
      renderKeys();
    }
    var idx = 0;
    for (var i = 0; i < N; i++){
      idx = (idx << 1) | (sliderBits[i] === 1 ? 1 : 0);
    }
    buffer = WORDS[idx];
    bufferEl.textContent = buffer;
    updateIndexDisplay(idx);
  });

  backspaceEl.addEventListener('click', function(){
    if (mode !== 'keys'){
      mode = 'keys';
      sliderBits = new Array(N).fill(null);
      buffer = '';
    } else {
      buffer = buffer.slice(0, -1);
    }
    renderBitsFromBuffer();
    renderKeys();
  });

  clearEl.addEventListener('click', resetAll);

  resetAll();
})();
